<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Helcim tokenization harness</title>
</head>
<body>
<!--
  TEMPORARY test harness. Safe to delete.

  Why it lives here: HelcimPay.js refuses to render from a localhost origin
  (verified: net::ERR_BLOCKED_BY_RESPONSE over both http and https loopback),
  and tunnel services are DNS-blocked on the dev network. It needs a real
  public HTTPS origin, which this domain provides.

  It holds no credentials. The Helcim checkout token is supplied at runtime as
  ?ct=... and is a short-lived, single-session, $0 verify token for a SANDBOX
  merchant account that has no live payment ability. Card entry happens inside
  Helcim's own iframe and never touches this page or this server.
-->
<h1>Helcim tokenization harness</h1>
<p id="status">waiting…</p>
<pre id="result"></pre>

<script src="https://secure.helcim.app/helcim-pay/services/start.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const ct = params.get("ct");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");

  window.__helcimResult = null;
  window.__helcimEvents = [];

  window.addEventListener("message", (event) => {
    const d = event.data;
    if (!d || typeof d !== "object") return;
    window.__helcimEvents.push(JSON.stringify(d).slice(0, 500));

    if (d.eventName === "helcim-pay-js-" + ct) {
      if (d.eventStatus === "SUCCESS") {
        const raw = typeof d.eventMessage === "string" ? JSON.parse(d.eventMessage) : d.eventMessage;
        const msg = (raw && raw.data && raw.data.data) || (raw && raw.data) || raw;
        window.__helcimResult = msg;
        statusEl.textContent = "SUCCESS";
        resultEl.textContent = JSON.stringify(msg, null, 2);
      } else {
        statusEl.textContent = d.eventStatus || "unknown";
        resultEl.textContent = JSON.stringify(d, null, 2);
      }
    }
  });

  if (!ct) {
    statusEl.textContent = "no ?ct= supplied";
  } else if (typeof window.appendHelcimPayIframe !== "function") {
    statusEl.textContent = "HelcimPay.js did not load";
  } else {
    try {
      window.appendHelcimPayIframe(ct);
      statusEl.textContent = "iframe appended";
      window.__appended = true;
    } catch (e) {
      statusEl.textContent = "append threw: " + (e && e.message);
    }
  }
</script>
</body>
</html>
